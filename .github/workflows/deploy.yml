name: Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Install Dependencies
      run: |
        # Mise à jour du lock en cas d'incompatibilité
        composer update --no-dev --optimize-autoloader --no-interaction --with-dependencies || \
        composer install --no-dev --optimize-autoloader --no-interaction

    - name: Build Assets
      run: |
        npm ci
        npm run build

    - name: Deploy to Production
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        echo "$DEPLOY_KEY" > deploy_key.pem
        chmod 600 deploy_key.pem
        
        # Sync files
        rsync -avz --delete \
          --exclude='.env' \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='tests' \
          --exclude='docs' \
          --exclude='scripts' \
          -e "ssh -i deploy_key.pem -o StrictHostKeyChecking=no" \
          ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
        
        # Run remote commands
        ssh -i deploy_key.pem -o StrictHostKeyChecking=no \
          "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && \
          php artisan optimize:clear && \
          php artisan optimize && \
          php artisan migrate --force && \
          php artisan config:cache && \
          php artisan route:cache && \
          php artisan view:cache && \
          php artisan event:cache"

    - name: Notify Success
      if: success() && secrets.SLACK_WEBHOOK != ''
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: '🚀 Déploiement Fundisc réussi !'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      continue-on-error: true

    - name: Notify Failure
      if: failure() && secrets.SLACK_WEBHOOK != ''
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: '❌ Échec du déploiement Fundisc'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      continue-on-error: true
